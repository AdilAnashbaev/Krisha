<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дома выше Абая — Достык</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #141a22;
    --bg-2: #1b2330;
    --card: #1f2836;
    --card-border: #2b3648;
    --gold: #c79a3d;
    --pine: #4a7361;
    --text: #ecе7dd;
    --text: #ece7dd;
    --text-dim: #9aa5b3;
    --danger: #c65c4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }
  .ridge{
    position:relative;
    background:
      linear-gradient(180deg, rgba(199,154,61,0.14), rgba(20,26,34,0) 70%),
      var(--bg-2);
    padding: 28px 20px 22px;
    overflow:hidden;
    border-bottom: 1px solid var(--card-border);
  }
  .ridge svg{
    position:absolute; left:0; right:0; bottom:-2px; width:100%; height:64px;
    opacity:0.55;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--gold);
    margin:0 0 8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 26px;
    line-height:1.15;
    margin:0 0 10px;
    position:relative;
  }
  .criteria{
    font-size:13px;
    color: var(--text-dim);
    line-height:1.5;
    margin:0;
    position:relative;
  }
  .criteria b{ color: var(--text); font-weight:600; }
  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; position:relative;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color: var(--text-dim);
  }
  .count-badge{
    background: var(--pine);
    color:#eaf3ee;
    padding: 3px 10px;
    border-radius: 100px;
    font-weight:500;
  }
  main{ padding: 16px; display:flex; flex-direction:column; gap:14px; }
  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow:hidden;
  }
  .photo{
    width:100%; aspect-ratio: 16/10; object-fit:cover; display:block;
    background: linear-gradient(135deg, #2a3546, #1b2330);
  }
  .photo-placeholder{
    width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #2a3546, #1b2330);
    color: var(--text-dim); font-size:12px; font-family:'IBM Plex Mono',monospace;
  }
  .card-body{ padding: 14px 16px 16px; }
  .price{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 22px;
    color: var(--gold);
    margin:0 0 6px;
  }
  .stats{
    display:flex; gap:14px; flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color: var(--text-dim);
    margin-bottom:10px;
  }
  .stats span b{ color: var(--text); font-weight:500; }
  .address{
    font-size: 13.5px;
    color: var(--text);
    margin: 0 0 12px;
    line-height:1.4;
  }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tag{
    font-size:10.5px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--pine);
    background: rgba(74,115,97,0.15);
    border: 1px solid rgba(74,115,97,0.4);
    padding: 3px 8px;
    border-radius: 100px;
  }
  a.open-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background: var(--gold);
    color: #1a1305;
    font-weight:600;
    font-size:14px;
    padding: 11px;
    border-radius: 10px;
  }
  a.open-btn:active{ opacity:.85; }
  .empty{
    text-align:center;
    padding: 60px 24px;
    color: var(--text-dim);
  }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty p{ font-size:14px; line-height:1.6; margin:0; }
  .footer-credit{
    text-align:center;
    padding: 18px 20px 28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color: var(--text-dim);
    opacity:.7;
  }
  .loading{ text-align:center; padding:60px 20px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; }
</style>
</head>
<body>

<div class="ridge">
  <p class="eyebrow">krisha.kz · ежедневный обход</p>
  <h1>Дома выше<br>Абая — Достык</h1>
  <p class="criteria">
    <b id="c-rooms">5–6</b> комнат ·
    <b id="c-price">100–140 млн ₸</b> ·
    1–2 этажа · от 170 м² · свежий ремонт ·
    отопление центральное/газ · канализация центральная
  </p>
  <div class="meta-row">
    <span id="updated-at">обновляется…</span>
    <span class="count-badge" id="count-badge">—</span>
  </div>
  <svg viewBox="0 0 400 64" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,64 40,30 80,48 130,14 180,42 230,20 270,46 320,26 360,44 400,32 400,64" fill="none" stroke="#c79a3d" stroke-width="1.2"/>
  </svg>
</div>


<main id="main">
  <div class="loading">Загружаю список…</div>
</main>

<p class="footer-credit">разработано Адилем Анашбаевым</p>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  function formatPrice(p){
    if (p == null) return '—';
    return Math.round(p).toLocaleString('ru-RU').replace(/,/g,' ') + ' ₸';
  }

  function formatUpdated(iso){
    if (!iso) return 'ещё не запускался';
    try {
      const d = new Date(iso);
      return 'обновлено ' + d.toLocaleString('ru-RU', {
        day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
      });
    } catch(e){ return iso; }
  }

  function card(listing){
    const el = document.createElement('div');
    el.className = 'card';

    const statsParts = [];
    statsParts.push(`<span><b>${listing.rooms}</b> комн.</span>`);
    if (listing.area_m2) statsParts.push(`<span><b>${listing.area_m2}</b> м²</span>`);
    if (listing.plot_sotka) statsParts.push(`<span><b>${listing.plot_sotka}</b> сот.</span>`);
    if (listing.floors) statsParts.push(`<span><b>${listing.floors}</b> эт.</span>`);

    const tags = [];
    if (listing.checks) {
      if (listing.checks.fresh_renovation) tags.push('свежий ремонт');
      if (listing.checks.heating) tags.push('отопление центр./газ');
      if (listing.checks.central_water) tags.push('центр. водоснабжение');
      if (listing.checks.central_sewerage) tags.push('центр. канализация');
    }
    if (listing.region) {
      tags.push(listing.region === 'besagash' ? 'Бесагаш' : 'Медеу');
    }

    const photoHtml = listing.photo_url
      ? `<img class="photo" src="${listing.photo_url}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;photo-placeholder&quot;>фото — на krisha.kz</div>'">`
      : `<div class="photo-placeholder">фото — на krisha.kz</div>`;

    el.innerHTML = `
      ${photoHtml}
      <div class="card-body">
        <p class="price">${formatPrice(listing.price)}</p>
        <div class="stats">${statsParts.join('')}</div>
        <p class="address">${listing.district_line || 'Медеуский р-н'}</p>
        <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <a class="open-btn" href="${listing.url}" target="_blank" rel="noopener">Открыть на Krisha →</a>
      </div>
    `;
    return el;
  }

  function renderEmpty(){
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="empty">
        <svg width="120" height="40" viewBox="0 0 400 64" xmlns="http://www.w3.org/2000/svg">
          <polyline points="0,64 40,30 80,48 130,14 180,42 230,20 270,46 320,26 360,44 400,32 400,64" fill="none" stroke="#9aa5b3" stroke-width="1.2"/>
        </svg>
        <p>Пока нет домов, подходящих под все критерии.<br>Список обновляется каждый день утром — загляните позже.</p>
      </div>
    `;
  }

  async function load(){
    const main = document.getElementById('main');
    try {
      const res = await fetch('data/listings.json?ts=' + Date.now());
      const data = await res.json();

      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);
      document.getElementById('count-badge').textContent = (data.count || 0) + ' найдено';
      if (data.criteria) {
        if (data.criteria.rooms) document.getElementById('c-rooms').textContent = data.criteria.rooms.join('–');
        if (data.criteria.price_from && data.criteria.price_to) {
          document.getElementById('c-price').textContent =
            Math.round(data.criteria.price_from/1e6) + '–' + Math.round(data.criteria.price_to/1e6) + ' млн ₸';
        }
      }

      main.innerHTML = '';
      if (!data.listings || data.listings.length === 0) {
        renderEmpty();
        return;
      }
      data.listings.forEach(l => main.appendChild(card(l)));
    } catch (e) {
      main.innerHTML = `<div class="empty"><p>Не удалось загрузить данные.<br>${e}</p></div>`;
    }
  }

  load();
</script>
</body>
</html>
